# Web版（EAS Hosting）へ自動デプロイする。
#
# - 既定ブランチへマージされると自動で公開される
# - GitHub の Actions タブ →「Deploy Web」→「Run workflow」で手動デプロイもできる
#   （環境変数だけ変えた時など、コード変更なしで公開し直したい場合に使う）
#
# 事前に GitHub のリポジトリ Secrets へ `EXPO_TOKEN` を登録しておくこと
# （expo.dev → アカウント設定 → Access tokens で発行）。
name: Deploy Web

on:
  push:
    branches: [claude/tabi-navi-react-rwn79e]
  workflow_dispatch: # 手動実行（再デプロイ用）

# 同時に複数のデプロイが走らないようにする（後から来たものを優先）
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 型チェック
        run: npx tsc --noEmit

      - name: テスト
        run: npx jest --ci

      - name: EAS CLI を用意
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 焼き込み対象の変数が EAS から読めているかをログに残す。
      # 値そのものは出さず、文字数だけ出す（0 なら未設定・visibility が secret 等）。
      - name: 公開する環境変数が読めているか確認
        run: |
          eas env:exec production 'echo "EXPO_PUBLIC_RAKUTEN_AFFILIATE_ID: ${#EXPO_PUBLIC_RAKUTEN_AFFILIATE_ID} 文字"; echo "EXPO_PUBLIC_AMAZON_TAG: ${#EXPO_PUBLIC_AMAZON_TAG} 文字"' --non-interactive

      - name: Web版をビルド
        # `eas env:exec` で包むのは EXPO_PUBLIC_* をバンドルに焼き込むため。
        #
        # EXPO_PUBLIC_* は「ビルド時にbabelが値を直接埋め込む」変数なので、
        # ビルドしているこのプロセスの環境に値が無いと undefined のまま固まる。
        # 下の `eas deploy --environment production` が紐付けるのは
        # サーバー（APIルート）が読む変数だけで、ビルド済みのクライアント
        # バンドルには後から入らない。
        #
        # これが無いと EXPO_PUBLIC_AMAZON_TAG / EXPO_PUBLIC_RAKUTEN_AFFILIATE_ID が
        # 空のままビルドされ、広告枠が本番で「エラーも出さずに1つも表示されない」。
        #
        # 環境名は `--environment` フラグではなく**位置引数**で渡す
        # （`eas env:exec ENVIRONMENT BASH_COMMAND`）。フラグで書くと
        # "Nonexistent flag: --environment" で落ちる。下の `eas deploy` は
        # フラグ形式なので、同じ書き方だと思って揃えないこと。
        #
        # --clear で Metro のトランスフォームキャッシュを毎回捨てる。
        # EXPO_PUBLIC_* はビルド時に値がコードへ焼き込まれるので、
        # 変数を足す前のキャッシュが残っていると**空のまま固まった結果が再利用される**。
        # 実際にこれで、提携IDが空のバンドルが本番へ出ていた。
        run: eas env:exec production "npx expo export --platform web --clear" --non-interactive

      - name: 本番へデプロイ
        # expo-github-action が `eas` コマンドを PATH に入れる。
        # `npx eas` だと npm が「eas」という別パッケージを探して
        # "could not determine executable to run" で落ちるため、直接呼ぶ。
        #
        # --environment production: `eas env:create --environment production` で
        # 登録したAPIキー（ANTHROPIC / GOOGLE_MAPS 等）をこのデプロイに紐付ける。
        # これが無いとCIからのデプロイはキー無しで動き、住所候補・AI・地図が
        # 全て静かに無効になる（手動デプロイでは手元の .env.local が拾われて
        # いたため気づかなかった）。
        run: eas deploy --prod --environment production
