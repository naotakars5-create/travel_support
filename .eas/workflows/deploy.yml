name: Deploy

# デフォルトブランチに変更が入るたびに、Expo のサーバー上で
# Web バンドルの書き出し → EAS Hosting への公開（本番）まで自動で行う。
# （このリポジトリのデフォルトブランチは claude/tabi-navi-react-rwn79e。将来 main に統一した場合も動くよう併記）
on:
  push:
    branches: ['claude/tabi-navi-react-rwn79e', 'main']

jobs:
  deploy:
    type: deploy
    name: Deploy
    environment: production
    params:
      prod: true
